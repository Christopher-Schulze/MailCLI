# Minimal portability gate: proves the build and unit suite are green on a
# clean second environment (macOS arm64, matching the verified dev host).
# Scope is deliberately narrow — no live tests, no keychain-dependent live
# paths, and no publication step. Release authority stays local: this
# workflow must never push, tag, release, or call the GitHub API; the local
# release-authority gate scans workflow files for exactly those commands.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: unit suite
        run: go test -count=1 -race -cover ./...
